<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking | Taniti Tourism</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        nav {
            background-color: #006d77;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        section {
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        textarea {
            height: 120px; /* Bigger for special requests */
        }

        button {
            padding: 12px;
            width: 100%;
            background-color: #006d77;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #005f63;
        }
    </style>
</head>

<body>


<nav>
    <a href="index.html">Home</a>
    <a href="activities.html">Activities</a>
    <a href="booking.html">Booking</a>
    <a href="transportation.html">Transportation</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
</nav>

<section>
    <h1>Booking Details </h1>
    <p>Fill out the form below to reserve your spot for your visit to Taniti.</p>

    <form>
        <!-- Full Name -->
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Your full name" required>

        <!-- Email and Phone -->
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567" required>

        <!-- Check-in / Check-out -->
        <label for="checkin">Check-in Date</label>
        <input type="date" id="checkin" name="checkin" required>

        <label for="checkout">Check-out Date</label>
        <input type="date" id="checkout" name="checkout" required>

        <!-- Number of Guests -->
        <label for="guests">Number of Guests</label>
        <select id="guests" name="guests">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5+</option>
        </select>

        <!-- Special Requests -->
        <label for="requests">Special Requests</label>
        <textarea id="requests" name="requests" placeholder="Any special requests?"></textarea>

        <button type="submit">Submit Booking</button>
    </form>
</sect
